<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARCHALEARN — Learn to Build, Build to Learn</title>
<meta name="description" content="Dual-Engine Adaptive Intelligence: Learning the Subject, Learning the Student. A living 3D valley of knowledge.">
<link rel="icon" type="image/png" href="assets/archalearn-emblem-clean.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;700&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --u: min(calc(100vw / 1600), calc(100vh / 900));
  --cream: #f5efe2;
  --gold: #e59b34;
  --teal: #14b8a6;
  --bg-dark: #000000;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #000; overflow: hidden; }
body {
  color: var(--cream);
  font-family: Manrope, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; outline: none; }

#valley { position: fixed; inset: 0; }
.js-canvas-container { position: absolute; inset: 0; }
.js-canvas-container canvas { display: block; width: 100% !important; height: 100% !important; }
.lil-gui { display: none !important; }

.ui {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  opacity: 0;
  transition: opacity 1.6s ease;
}
.ui.on { opacity: 1; }
.ui a, .ui button { pointer-events: auto; }

/* Top Header (Clean: Logo Only) */
header {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  padding: calc(24 * var(--u)) calc(44 * var(--u)) 0;
  z-index: 10;
}

.logo-wrap {
  display: flex;
  align-items: center;
  gap: calc(12 * var(--u));
}

.logo-emblem {
  height: calc(36 * var(--u));
  width: auto;
  filter: drop-shadow(0 0 16px rgba(229, 155, 52, 0.45));
  transition: transform 0.35s ease;
}

.logo-wrap:hover .logo-emblem {
  transform: rotate(6deg) scale(1.08);
}

.logo-wordmark {
  height: calc(22 * var(--u));
  width: auto;
  object-fit: contain;
}

/* Centered Hero Section */
.hero {
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  transform: translateY(-46%);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 0 calc(20 * var(--u));
}

.eyebrow {
  font-size: calc(12 * var(--u));
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: calc(18 * var(--u));
  font-weight: 600;
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
}

h1 {
  font: 400 calc(150 * var(--u)) / 0.92 Antonio, "Arial Narrow", sans-serif;
  letter-spacing: -0.012em;
  white-space: nowrap;
  color: var(--cream);
  text-shadow: 0 8px 40px rgba(0, 0, 0, 0.9);
  user-select: none;
}

.cap {
  margin-top: calc(38 * var(--u));
  font-size: calc(20 * var(--u));
  line-height: 1.4;
  color: rgba(245, 239, 226, 0.78);
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
}

/* Central Portal Arrow Button */
.go {
  display: grid;
  place-items: center;
  margin-top: calc(34 * var(--u));
  width: calc(58 * var(--u));
  height: calc(58 * var(--u));
  border: 1.5px solid var(--cream);
  border-radius: 50%;
  transition: background 0.3s, color 0.3s, transform 0.3s, box-shadow 0.3s;
  color: var(--cream);
  cursor: pointer;
}

.go:hover {
  background: var(--cream);
  color: #151510;
  transform: scale(1.12);
  box-shadow: 0 0 35px rgba(245, 239, 226, 0.6);
}

.go svg {
  width: calc(22 * var(--u));
  height: calc(22 * var(--u));
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* Bottom HUD telemetry & sound controls */
.corner-left {
  position: absolute;
  left: calc(44 * var(--u));
  bottom: calc(44 * var(--u));
  display: flex;
  align-items: center;
  gap: calc(12 * var(--u));
  font-size: calc(12 * var(--u));
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(245, 239, 226, 0.65);
  font-family: 'JetBrains Mono', monospace;
}

.beacon {
  width: calc(6 * var(--u));
  height: calc(6 * var(--u));
  border-radius: 50%;
  background: var(--teal);
  box-shadow: 0 0 10px var(--teal);
  animation: pulse-beacon 2s infinite ease-in-out;
}

@keyframes pulse-beacon {
  0%, 100% { opacity: 0.4; transform: scale(0.9); }
  50% { opacity: 1; transform: scale(1.4); }
}

.corner {
  position: absolute;
  right: calc(44 * var(--u));
  bottom: calc(44 * var(--u));
  display: flex;
  align-items: center;
  gap: calc(18 * var(--u));
  font-size: calc(12.5 * var(--u));
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(245, 239, 226, 0.7);
}

.corner i {
  width: 1px;
  height: calc(26 * var(--u));
  background: rgba(245, 239, 226, 0.45);
}

.sound {
  display: grid;
  place-items: center;
  width: calc(28 * var(--u));
  height: calc(28 * var(--u));
  color: var(--cream);
  transition: transform 0.2s ease;
}

.sound:hover { transform: scale(1.15); }
.sound svg {
  width: 100%;
  height: 100%;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.sound .w { transition: opacity 0.3s; }
.sound[aria-pressed=false] .w { opacity: 0; }
.sound[aria-pressed=true] .x { opacity: 0; }

/* Minimalist Loader */
.loader {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: grid;
  place-items: center;
  background: #000;
  transition: opacity 1s ease;
  pointer-events: none;
}
.loader.gone { opacity: 0; }
.loader span {
  width: calc(9 * var(--u));
  height: calc(9 * var(--u));
  min-width: 6px;
  min-height: 6px;
  border-radius: 50%;
  background: var(--cream);
  animation: pulse 1.2s ease-in-out infinite;
}
@keyframes pulse { 50% { transform: scale(0.4); opacity: 0.4; } }

/* Mobile Responsiveness */
@media (max-width: 820px) {
  :root { --u: 1px; }
  header { padding: 18px 18px 0; }
  .hero { left: 20px; right: 20px; }
  .corner-left { display: none; }
  .corner { left: 20px; justify-content: center; }
  h1 { font-size: clamp(52px, 15vw, 84px); white-space: normal; line-height: 0.98; }
  .cap { font-size: 16px; margin-top: 24px; }
  .corner { right: 20px; bottom: 30px; font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) { .loader span { animation: none; } }
</style>
</head>
